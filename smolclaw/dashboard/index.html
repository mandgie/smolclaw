<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>smolclaw</title>
<style>
  :root {
    --bg: #0a0a0a; --surface: #141414; --border: #222; --text: #e0e0e0;
    --muted: #888; --accent: #4ade80; --accent-dim: #1a3a2a; --red: #ef4444;
    --yellow: #eab308; --font: 'SF Mono', 'Menlo', 'Consolas', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); padding: 24px; }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
  .header-right { display: flex; gap: 12px; align-items: center; font-size: 11px; }
  .header-right a {
    color: var(--accent); text-decoration: none; padding: 4px 10px;
    border: 1px solid var(--border); border-radius: 4px; transition: border-color 0.2s;
  }
  .header-right a:hover { border-color: var(--accent); }
  .header-version { color: var(--muted); }
  .subtitle { color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; cursor: pointer; transition: border-color 0.2s;
  }
  .card:hover { border-color: var(--accent); }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .card-name { font-size: 15px; font-weight: 600; }
  .status { width: 8px; height: 8px; border-radius: 50%; }
  .status.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .status.off { background: var(--muted); }
  .card-meta { font-size: 11px; color: var(--muted); line-height: 1.8; }
  .card-meta span { display: inline-block; background: var(--bg); padding: 2px 6px; border-radius: 4px; margin-right: 4px; }
  .section-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 8px; border-bottom: 1px solid var(--border); }
  td { padding: 8px; border-bottom: 1px solid var(--border); }
  .tag { font-size: 10px; padding: 2px 6px; border-radius: 3px; }
  .tag-ok { background: var(--accent-dim); color: var(--accent); }
  .tag-err { background: #2a1a1a; color: var(--red); }
  .tag-pending { background: #1a1a0a; color: var(--yellow); }
  .health { position: fixed; bottom: 16px; right: 16px; font-size: 11px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; padding: 32px; text-align: center; }

  /* Chat / Session panel overlay */
  .chat-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 100; backdrop-filter: blur(4px);
  }
  .chat-overlay.open { display: flex; justify-content: center; align-items: center; }
  .chat-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    width: min(720px, 92vw); height: min(700px, 88vh); display: flex; flex-direction: column;
    overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .chat-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .chat-header-left { display: flex; align-items: center; gap: 10px; }
  .chat-header-name { font-size: 14px; font-weight: 600; }
  .chat-header-model { font-size: 11px; color: var(--muted); }
  .chat-header-actions { display: flex; gap: 6px; }
  .chat-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    font-family: var(--font); font-size: 11px; padding: 4px 10px; border-radius: 4px;
    cursor: pointer; transition: all 0.2s;
  }
  .chat-btn:hover { border-color: var(--accent); color: var(--accent); }
  .chat-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .chat-btn-close { font-size: 16px; padding: 2px 8px; line-height: 1; }
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .chat-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 12px;
  }
  .msg { max-width: 85%; font-size: 13px; line-height: 1.6; }
  .msg-user {
    align-self: flex-end; background: var(--accent-dim); color: var(--accent);
    padding: 8px 14px; border-radius: 12px 12px 2px 12px;
  }
  .msg-agent {
    align-self: flex-start; background: var(--bg); color: var(--text);
    padding: 8px 14px; border-radius: 12px 12px 12px 2px; border: 1px solid var(--border);
  }
  .msg-agent pre { background: #0d0d0d; padding: 8px 10px; border-radius: 4px; overflow-x: auto; margin: 6px 0; }
  .msg-agent code { font-size: 12px; }
  .msg-agent p { margin: 4px 0; }
  .msg-thinking {
    align-self: flex-start; color: var(--muted); font-size: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .msg-thinking .dots span {
    display: inline-block; width: 4px; height: 4px; border-radius: 50%;
    background: var(--muted); animation: blink 1.4s infinite;
  }
  .msg-thinking .dots span:nth-child(2) { animation-delay: 0.2s; }
  .msg-thinking .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
  .msg-meta {
    font-size: 10px; color: var(--muted); margin-top: 4px; display: flex; gap: 8px;
    align-items: center; opacity: 0.7;
  }
  .msg-meta span { display: inline-flex; align-items: center; gap: 3px; }
  .msg-ts { font-size: 10px; color: var(--muted); margin-top: 2px; opacity: 0.5; }
  .chat-session-cost { font-size: 10px; color: var(--muted); }
  .chat-input-area {
    display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .chat-input-area.hidden { display: none; }
  .chat-input {
    flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    font-family: var(--font); font-size: 13px; padding: 10px 14px; border-radius: 8px;
    outline: none; resize: none; min-height: 20px; max-height: 120px;
  }
  .chat-input:focus { border-color: var(--accent); }
  .chat-input::placeholder { color: var(--muted); }
  .chat-send {
    background: var(--accent); color: var(--bg); border: none; font-family: var(--font);
    font-size: 13px; font-weight: 600; padding: 10px 18px; border-radius: 8px; cursor: pointer;
    transition: opacity 0.2s; align-self: flex-end;
  }
  .chat-send:hover { opacity: 0.85; }
  .chat-send:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Session list */
  .session-item {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; cursor: pointer; transition: border-color 0.2s; width: 100%;
  }
  .session-item:hover { border-color: var(--accent); }
  .session-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .session-item-date { font-size: 12px; font-weight: 500; }
  .session-item-meta { font-size: 10px; color: var(--muted); }
  .session-item-preview { font-size: 12px; color: var(--muted); line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Session detail header bar */
  .session-bar {
    display: flex; align-items: center; gap: 10px; padding: 8px 18px;
    border-bottom: 1px solid var(--border); background: var(--bg); flex-shrink: 0;
    font-size: 11px; color: var(--muted);
  }
  .session-bar.hidden { display: none; }
  .session-bar-back {
    background: none; border: 1px solid var(--border); color: var(--muted);
    font-family: var(--font); font-size: 11px; padding: 3px 8px; border-radius: 4px;
    cursor: pointer; transition: all 0.2s;
  }
  .session-bar-back:hover { border-color: var(--accent); color: var(--accent); }

  /* Agent detail view */
  .detail-view { padding: 18px; overflow-y: auto; flex: 1; display: none; flex-direction: column; gap: 16px; }
  .detail-view.visible { display: flex; }
  .detail-section {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  .detail-section-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; cursor: pointer; font-size: 12px; font-weight: 600;
    color: var(--text); transition: background 0.2s;
  }
  .detail-section-header:hover { background: var(--surface); }
  .detail-section-header .arrow { color: var(--muted); font-size: 10px; transition: transform 0.2s; }
  .detail-section-header .arrow.open { transform: rotate(90deg); }
  .detail-section-body { display: none; padding: 12px 14px; border-top: 1px solid var(--border); font-size: 12px; line-height: 1.6; }
  .detail-section-body.open { display: block; }
  .detail-section-body pre {
    background: var(--surface); padding: 10px 12px; border-radius: 4px;
    overflow-x: auto; font-size: 11px; white-space: pre-wrap; word-break: break-word;
    color: var(--text); margin: 0;
  }
  .detail-kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 12px; font-size: 12px; }
  .detail-kv .label { color: var(--muted); }
  .detail-kv .value { color: var(--text); }
  .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .detail-tag {
    font-size: 11px; padding: 3px 8px; border-radius: 4px;
    background: var(--accent-dim); color: var(--accent); border: 1px solid transparent;
  }
  .detail-tag.muted { background: var(--bg); color: var(--muted); border-color: var(--border); }
  .detail-empty { color: var(--muted); font-style: italic; font-size: 12px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>smolclaw</h1>
    <p class="subtitle">multi-agent gateway</p>
  </div>
  <div class="header-right">
    <span class="header-version" id="version"></span>
    <a href="/docs" target="_blank">API Docs</a>
  </div>
</div>

<div class="section-title">Agents</div>
<div class="grid" id="agents"><div class="empty">Loading...</div></div>

<div class="section-title">Scheduled Jobs</div>
<table id="jobs-table">
  <thead><tr><th>ID</th><th>Agent</th><th>Schedule</th><th>Status</th><th>Last Run</th><th>Next Run</th></tr></thead>
  <tbody id="jobs"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody>
</table>

<div class="health"><span id="ws-status"></span><span id="health"></span></div>

<!-- Chat / Session Panel -->
<div class="chat-overlay" id="chat-overlay">
  <div class="chat-panel">
    <div class="chat-header">
      <div class="chat-header-left">
        <span class="status on" id="chat-status"></span>
        <span class="chat-header-name" id="chat-name"></span>
        <span class="chat-header-model" id="chat-model"></span>
        <span class="chat-session-cost" id="chat-cost"></span>
      </div>
      <div class="chat-header-actions">
        <button class="chat-btn active" id="btn-chat" title="Live chat">Chat</button>
        <button class="chat-btn" id="btn-history" title="Session history">History</button>
        <button class="chat-btn" id="btn-details" title="Agent details">Details</button>
        <button class="chat-btn" id="chat-new" title="New session">New</button>
        <button class="chat-btn chat-btn-close" id="chat-close" title="Close">&#x2715;</button>
      </div>
    </div>
    <div class="session-bar hidden" id="session-bar">
      <button class="session-bar-back" id="session-back">&#x2190; Back</button>
      <span id="session-bar-info"></span>
    </div>
    <div class="chat-messages" id="chat-messages">
      <div class="chat-empty">Send a message to start chatting</div>
    </div>
    <div class="detail-view" id="detail-view"></div>
    <div class="chat-input-area" id="chat-input-area">
      <textarea class="chat-input" id="chat-input" placeholder="Message..." rows="1"></textarea>
      <button class="chat-send" id="chat-send">Send</button>
    </div>
  </div>
</div>

<script>
const API = '';

// --- Data fetching ---
async function fetchAgents() {
  try {
    const res = await fetch(`${API}/api/agents`);
    const data = await res.json();
    const el = document.getElementById('agents');
    if (!data.agents.length) { el.innerHTML = '<div class="empty">No agents configured.</div>'; return; }
    el.innerHTML = data.agents.map(a => `
      <div class="card" onclick="openChat('${a.name}', '${a.model}', ${a.connected})">
        <div class="card-header">
          <span class="card-name">${a.name}</span>
          <span class="status ${a.connected ? 'on' : 'off'}"></span>
        </div>
        <div class="card-meta">
          <span>${a.model}</span><br>
          ${a.channels.map(c => `<span>${c}</span>`).join('')}
          <span>${a.skills} skills</span>
          ${a.memory ? `<span>${a.memory.facts} facts</span>` : ''}
        </div>
      </div>
    `).join('');
  } catch(e) { document.getElementById('agents').innerHTML = '<div class="empty">Failed to connect.</div>'; }
}

async function fetchJobs() {
  try {
    const res = await fetch(`${API}/api/cron/jobs`);
    const data = await res.json();
    const el = document.getElementById('jobs');
    if (!data.jobs.length) { el.innerHTML = '<tr><td colspan="6" class="empty">No jobs.</td></tr>'; return; }
    el.innerHTML = data.jobs.map(j => `
      <tr>
        <td>${j.id}</td>
        <td>${j.agent}</td>
        <td><code>${j.schedule}</code></td>
        <td><span class="tag tag-${j.status === 'ok' ? 'ok' : j.status === 'error' ? 'err' : 'pending'}">${j.status}</span></td>
        <td>${j.last_run ? new Date(j.last_run).toLocaleString() : '—'}</td>
        <td>${j.next_run ? new Date(j.next_run).toLocaleString() : '—'}</td>
      </tr>
    `).join('');
  } catch(e) {}
}

async function fetchHealth() {
  try {
    const res = await fetch(`${API}/api/health`);
    const data = await res.json();
    document.getElementById('health').textContent =
      `${data.agents} agents · ${data.channels} channels · ${data.jobs} jobs`;
    if (data.version) {
      document.getElementById('version').textContent = `v${data.version}`;
    }
  } catch(e) { document.getElementById('health').textContent = 'disconnected'; }
}

// --- Chat panel state ---
let chatAgent = null;
let sessionCost = 0;
let panelView = 'chat'; // 'chat' | 'sessions' | 'session-detail' | 'details'

function openChat(name, model, connected) {
  chatAgent = name;
  sessionCost = 0;
  panelView = 'chat';
  document.getElementById('chat-cost').textContent = '';
  document.getElementById('chat-name').textContent = name;
  document.getElementById('chat-model').textContent = model;
  document.getElementById('chat-status').className = `status ${connected ? 'on' : 'off'}`;
  document.getElementById('chat-overlay').classList.add('open');
  updatePanelView();
  document.getElementById('chat-input').focus();
}

function closeChat() {
  chatAgent = null;
  document.getElementById('chat-overlay').classList.remove('open');
}

function updatePanelView() {
  const inputArea = document.getElementById('chat-input-area');
  const sessionBar = document.getElementById('session-bar');
  const chatMessages = document.getElementById('chat-messages');
  const detailView = document.getElementById('detail-view');
  const btnChat = document.getElementById('btn-chat');
  const btnHistory = document.getElementById('btn-history');
  const btnDetails = document.getElementById('btn-details');

  btnChat.classList.toggle('active', panelView === 'chat');
  btnHistory.classList.toggle('active', panelView === 'sessions' || panelView === 'session-detail');
  btnDetails.classList.toggle('active', panelView === 'details');

  // Show/hide detail view vs chat messages
  if (panelView === 'details') {
    chatMessages.style.display = 'none';
    detailView.classList.add('visible');
    inputArea.classList.add('hidden');
    sessionBar.classList.add('hidden');
  } else {
    chatMessages.style.display = '';
    detailView.classList.remove('visible');
    if (panelView === 'chat') {
      inputArea.classList.remove('hidden');
      sessionBar.classList.add('hidden');
    } else if (panelView === 'sessions') {
      inputArea.classList.add('hidden');
      sessionBar.classList.add('hidden');
    } else {
      inputArea.classList.add('hidden');
      sessionBar.classList.remove('hidden');
    }
  }
}

// --- Live chat ---
function clearMessages() {
  document.getElementById('chat-messages').innerHTML =
    '<div class="chat-empty">Send a message to start chatting</div>';
}

function addMessage(role, text, meta) {
  const container = document.getElementById('chat-messages');
  const empty = container.querySelector('.chat-empty');
  if (empty) empty.remove();
  const thinking = container.querySelector('.msg-thinking');
  if (thinking) thinking.remove();

  const div = document.createElement('div');
  div.className = `msg msg-${role}`;
  if (role === 'agent') {
    div.innerHTML = renderMarkdown(text);
    if (meta && (meta.cost_usd || meta.usage || meta.duration_ms)) {
      const metaDiv = document.createElement('div');
      metaDiv.className = 'msg-meta';
      const parts = [];
      if (meta.cost_usd != null) parts.push(`<span>$${meta.cost_usd.toFixed(4)}</span>`);
      if (meta.usage) {
        const inp = meta.usage.input_tokens || 0;
        const out = meta.usage.output_tokens || 0;
        parts.push(`<span>${inp + out} tokens</span>`);
      }
      if (meta.duration_ms) parts.push(`<span>${(meta.duration_ms / 1000).toFixed(1)}s</span>`);
      if (meta.num_turns) parts.push(`<span>${meta.num_turns} turns</span>`);
      if (meta.stop_reason && meta.stop_reason !== 'end_turn') parts.push(`<span style="color:var(--yellow)">${meta.stop_reason}</span>`);
      metaDiv.innerHTML = parts.join('');
      div.appendChild(metaDiv);
      if (meta.cost_usd) {
        sessionCost += meta.cost_usd;
        document.getElementById('chat-cost').textContent = `$${sessionCost.toFixed(4)}`;
      }
    }
  } else {
    div.textContent = text;
  }
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function showThinking() {
  const container = document.getElementById('chat-messages');
  const empty = container.querySelector('.chat-empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'msg-thinking';
  div.innerHTML = 'Thinking <span class="dots"><span></span><span></span><span></span></span>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function renderMarkdown(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || !chatAgent) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('chat-send').disabled = true;

  addMessage('user', text);
  showThinking();

  try {
    const res = await fetch(`${API}/api/agents/${encodeURIComponent(chatAgent)}/send`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    const data = await res.json();
    if (res.ok) {
      addMessage('agent', data.response, { cost_usd: data.cost_usd, usage: data.usage, duration_ms: data.duration_ms, num_turns: data.num_turns, stop_reason: data.stop_reason });
    } else {
      addMessage('agent', `Error: ${data.detail || 'Unknown error'}`);
    }
  } catch (e) {
    addMessage('agent', `Connection failed: ${e.message}`);
  }
  document.getElementById('chat-send').disabled = false;
  document.getElementById('chat-input').focus();
}

async function newSession() {
  if (!chatAgent) return;
  try {
    await fetch(`${API}/api/agents/${encodeURIComponent(chatAgent)}/new-session`, { method: 'POST' });
  } catch(e) {}
  clearMessages();
  sessionCost = 0;
  document.getElementById('chat-cost').textContent = '';
  panelView = 'chat';
  updatePanelView();
  document.getElementById('chat-input').focus();
}

// --- Session history ---
function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const now = new Date();
  const diff = now - d;
  const days = Math.floor(diff / 86400000);
  if (days === 0) return 'Today ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (days === 1) return 'Yesterday ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (days < 7) return d.toLocaleDateString([], { weekday: 'short' }) + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function formatTimestamp(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

async function showSessions() {
  if (!chatAgent) return;
  panelView = 'sessions';
  updatePanelView();

  const container = document.getElementById('chat-messages');
  container.innerHTML = '<div class="chat-empty">Loading sessions...</div>';

  try {
    const res = await fetch(`${API}/api/agents/${encodeURIComponent(chatAgent)}/sessions`);
    const data = await res.json();

    if (!data.sessions.length) {
      container.innerHTML = '<div class="chat-empty">No sessions found</div>';
      return;
    }

    container.innerHTML = data.sessions.map(s => `
      <div class="session-item" onclick="loadSession('${s.id}')">
        <div class="session-item-header">
          <span class="session-item-date">${formatDate(s.created)}</span>
          <span class="session-item-meta">${s.messages} msgs &middot; ${formatBytes(s.size_bytes)}</span>
        </div>
        <div class="session-item-preview">${escapeHtml(s.preview || '(no preview)')}</div>
      </div>
    `).join('');
  } catch(e) {
    container.innerHTML = `<div class="chat-empty">Failed to load sessions: ${e.message}</div>`;
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

async function loadSession(sessionId) {
  if (!chatAgent) return;
  panelView = 'session-detail';
  updatePanelView();

  const container = document.getElementById('chat-messages');
  container.innerHTML = '<div class="chat-empty">Loading conversation...</div>';
  document.getElementById('session-bar-info').textContent = `Session ${sessionId.slice(0, 8)}...`;

  try {
    const res = await fetch(`${API}/api/agents/${encodeURIComponent(chatAgent)}/sessions/${sessionId}`);
    const data = await res.json();

    if (!data.messages.length) {
      container.innerHTML = '<div class="chat-empty">Empty session</div>';
      return;
    }

    container.innerHTML = '';
    for (const msg of data.messages) {
      const div = document.createElement('div');
      if (msg.role === 'user') {
        div.className = 'msg msg-user';
        div.textContent = msg.text;
      } else {
        div.className = 'msg msg-agent';
        div.innerHTML = renderMarkdown(msg.text);
      }
      container.appendChild(div);

      if (msg.timestamp) {
        const ts = document.createElement('div');
        ts.className = 'msg-ts';
        ts.style.alignSelf = msg.role === 'user' ? 'flex-end' : 'flex-start';
        ts.textContent = formatTimestamp(msg.timestamp);
        container.appendChild(ts);
      }
    }

    container.scrollTop = 0;
  } catch(e) {
    container.innerHTML = `<div class="chat-empty">Failed to load session: ${e.message}</div>`;
  }
}

function switchToChat() {
  panelView = 'chat';
  updatePanelView();
  clearMessages();
  document.getElementById('chat-input').focus();
}

// --- Agent detail view ---
function toggleSection(el) {
  const body = el.nextElementSibling;
  const arrow = el.querySelector('.arrow');
  body.classList.toggle('open');
  arrow.classList.toggle('open');
}

function makeSection(title, content, startOpen) {
  return `<div class="detail-section">
    <div class="detail-section-header" onclick="toggleSection(this)">
      <span>${title}</span>
      <span class="arrow ${startOpen ? 'open' : ''}">&#x25B6;</span>
    </div>
    <div class="detail-section-body ${startOpen ? 'open' : ''}">${content}</div>
  </div>`;
}

async function showDetails() {
  if (!chatAgent) return;
  panelView = 'details';
  updatePanelView();

  const container = document.getElementById('detail-view');
  container.innerHTML = '<div class="chat-empty">Loading agent details...</div>';

  try {
    const res = await fetch(`${API}/api/agents/${encodeURIComponent(chatAgent)}`);
    const a = await res.json();

    let html = '';

    // Config section (always open)
    let configHtml = '<div class="detail-kv">';
    configHtml += `<span class="label">Model</span><span class="value">${a.model}</span>`;
    if (a.config.max_budget_usd) configHtml += `<span class="label">Budget</span><span class="value">$${a.config.max_budget_usd}/run</span>`;
    if (a.config.fallback_model) configHtml += `<span class="label">Fallback</span><span class="value">${a.config.fallback_model}</span>`;
    if (a.config.max_turns) configHtml += `<span class="label">Max turns</span><span class="value">${a.config.max_turns}</span>`;
    if (a.config.effort) configHtml += `<span class="label">Effort</span><span class="value">${a.config.effort}</span>`;
    if (a.config.thinking) configHtml += `<span class="label">Thinking</span><span class="value">${JSON.stringify(a.config.thinking)}</span>`;
    if (a.config.file_checkpointing) configHtml += `<span class="label">Checkpointing</span><span class="value">enabled</span>`;
    if (a.config.mcp_servers) configHtml += `<span class="label">MCP</span><span class="value">configured</span>`;
    configHtml += `<span class="label">Memory</span><span class="value">${a.config.memory.enabled ? 'enabled' : 'disabled'}${a.config.memory.cross_agent ? ' (cross-agent)' : ''}</span>`;
    const chNames = Object.keys(a.config.channels);
    configHtml += `<span class="label">Channels</span><span class="value">${chNames.length ? chNames.join(', ') : 'none'}</span>`;
    configHtml += '</div>';
    html += makeSection('Configuration', configHtml, true);

    // Memory stats
    if (a.memory) {
      let memHtml = '<div class="detail-kv">';
      memHtml += `<span class="label">Facts</span><span class="value">${a.memory.facts || 0}</span>`;
      memHtml += `<span class="label">Chunks</span><span class="value">${a.memory.chunks || 0}</span>`;
      if (a.memory.vec_status) memHtml += `<span class="label">Vector</span><span class="value">${a.memory.vec_status}</span>`;
      memHtml += '</div>';
      html += makeSection('Memory', memHtml, true);
    }

    // Skills
    if (a.skill_names && a.skill_names.length) {
      let skillHtml = '<div class="detail-tags">';
      skillHtml += a.skill_names.map(s => `<span class="detail-tag">${escapeHtml(s)}</span>`).join('');
      skillHtml += '</div>';
      html += makeSection(`Skills (${a.skill_names.length})`, skillHtml, true);
    } else {
      html += makeSection('Skills', '<span class="detail-empty">No skills configured</span>', false);
    }

    // Peers
    if (a.peers && a.peers.length) {
      let peerHtml = '<div class="detail-tags">';
      peerHtml += a.peers.map(p => `<span class="detail-tag muted">${escapeHtml(p.name)} <span style="color:var(--muted)">(${p.model})</span></span>`).join('');
      peerHtml += '</div>';
      html += makeSection(`Peers (${a.peers.length})`, peerHtml, true);
    }

    // Soul
    if (a.soul) {
      html += makeSection('Soul', `<pre>${escapeHtml(a.soul)}</pre>`, false);
    }

    // Agents.md
    if (a.agents_md) {
      html += makeSection('Operational Rules', `<pre>${escapeHtml(a.agents_md)}</pre>`, false);
    }

    // Context files
    const ctxKeys = Object.keys(a.context_files || {});
    if (ctxKeys.length) {
      for (const key of ctxKeys) {
        html += makeSection(`Context: ${escapeHtml(key)}`, `<pre>${escapeHtml(a.context_files[key])}</pre>`, false);
      }
    }

    container.innerHTML = html;
  } catch(e) {
    container.innerHTML = `<div class="chat-empty">Failed to load details: ${e.message}</div>`;
  }
}

// --- Event listeners ---
document.getElementById('chat-close').addEventListener('click', closeChat);
document.getElementById('chat-new').addEventListener('click', newSession);
document.getElementById('chat-send').addEventListener('click', sendMessage);
document.getElementById('btn-chat').addEventListener('click', switchToChat);
document.getElementById('btn-history').addEventListener('click', showSessions);
document.getElementById('btn-details').addEventListener('click', showDetails);
document.getElementById('session-back').addEventListener('click', showSessions);
document.getElementById('chat-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('chat-overlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeChat();
});
document.getElementById('chat-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeChat();
});

// --- WebSocket live updates with polling fallback ---
let ws = null;
let pollTimer = null;
let wsConnected = false;

function refreshAll() { fetchAgents(); fetchJobs(); fetchHealth(); }

function startPolling() {
  if (!pollTimer) pollTimer = setInterval(refreshAll, 10000);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

function updateConnectionStatus() {
  const el = document.getElementById('ws-status');
  if (wsConnected) {
    el.textContent = '● live · ';
    el.style.color = 'var(--accent)';
  } else {
    el.textContent = '○ polling · ';
    el.style.color = 'var(--muted)';
  }
}

function connectWS() {
  try {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws`);
  } catch(e) { startPolling(); return; }

  ws.onopen = () => {
    wsConnected = true;
    stopPolling();
    updateConnectionStatus();
  };

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.event === 'agents') fetchAgents();
      else if (msg.event === 'jobs') fetchJobs();
      else if (msg.event === 'health') fetchHealth();
    } catch(err) {}
  };

  ws.onclose = () => {
    wsConnected = false;
    updateConnectionStatus();
    startPolling();
    setTimeout(connectWS, 5000);
  };

  ws.onerror = () => { ws.close(); };
}

refreshAll();
connectWS();
</script>
