<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>smolclaw</title>
<style>
  :root {
    --bg: #0a0a0a; --surface: #141414; --border: #222; --text: #e0e0e0;
    --muted: #888; --accent: #4ade80; --accent-dim: #1a3a2a; --red: #ef4444;
    --yellow: #eab308; --font: 'SF Mono', 'Menlo', 'Consolas', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); padding: 24px; }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
  .header-right { display: flex; gap: 12px; align-items: center; font-size: 11px; }
  .header-right a {
    color: var(--accent); text-decoration: none; padding: 4px 10px;
    border: 1px solid var(--border); border-radius: 4px; transition: border-color 0.2s;
  }
  .header-right a:hover { border-color: var(--accent); }
  .header-version { color: var(--muted); }
  .subtitle { color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; cursor: pointer; transition: border-color 0.2s;
  }
  .card:hover { border-color: var(--accent); }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .card-name { font-size: 15px; font-weight: 600; }
  .status { width: 8px; height: 8px; border-radius: 50%; }
  .status.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .status.off { background: var(--muted); }
  .card-meta { font-size: 11px; color: var(--muted); line-height: 1.8; }
  .card-meta span { display: inline-block; background: var(--bg); padding: 2px 6px; border-radius: 4px; margin-right: 4px; }
  .section-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 8px; border-bottom: 1px solid var(--border); }
  td { padding: 8px; border-bottom: 1px solid var(--border); }
  .tag { font-size: 10px; padding: 2px 6px; border-radius: 3px; }
  .tag-ok { background: var(--accent-dim); color: var(--accent); }
  .tag-err { background: #2a1a1a; color: var(--red); }
  .tag-pending { background: #1a1a0a; color: var(--yellow); }
  .health { position: fixed; bottom: 16px; right: 16px; font-size: 11px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; padding: 32px; text-align: center; }

  /* Chat panel */
  .chat-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 100; backdrop-filter: blur(4px);
  }
  .chat-overlay.open { display: flex; justify-content: center; align-items: center; }
  .chat-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    width: min(640px, 90vw); height: min(600px, 85vh); display: flex; flex-direction: column;
    overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .chat-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .chat-header-left { display: flex; align-items: center; gap: 10px; }
  .chat-header-name { font-size: 14px; font-weight: 600; }
  .chat-header-model { font-size: 11px; color: var(--muted); }
  .chat-header-actions { display: flex; gap: 8px; }
  .chat-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    font-family: var(--font); font-size: 11px; padding: 4px 10px; border-radius: 4px;
    cursor: pointer; transition: all 0.2s;
  }
  .chat-btn:hover { border-color: var(--accent); color: var(--accent); }
  .chat-btn-close { font-size: 16px; padding: 2px 8px; line-height: 1; }
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .chat-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 12px;
  }
  .msg { max-width: 85%; font-size: 13px; line-height: 1.6; }
  .msg-user {
    align-self: flex-end; background: var(--accent-dim); color: var(--accent);
    padding: 8px 14px; border-radius: 12px 12px 2px 12px;
  }
  .msg-agent {
    align-self: flex-start; background: var(--bg); color: var(--text);
    padding: 8px 14px; border-radius: 12px 12px 12px 2px; border: 1px solid var(--border);
  }
  .msg-agent pre { background: #0d0d0d; padding: 8px 10px; border-radius: 4px; overflow-x: auto; margin: 6px 0; }
  .msg-agent code { font-size: 12px; }
  .msg-agent p { margin: 4px 0; }
  .msg-thinking {
    align-self: flex-start; color: var(--muted); font-size: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .msg-thinking .dots span {
    display: inline-block; width: 4px; height: 4px; border-radius: 50%;
    background: var(--muted); animation: blink 1.4s infinite;
  }
  .msg-thinking .dots span:nth-child(2) { animation-delay: 0.2s; }
  .msg-thinking .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
  .chat-input-area {
    display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .chat-input {
    flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    font-family: var(--font); font-size: 13px; padding: 10px 14px; border-radius: 8px;
    outline: none; resize: none; min-height: 20px; max-height: 120px;
  }
  .chat-input:focus { border-color: var(--accent); }
  .chat-input::placeholder { color: var(--muted); }
  .chat-send {
    background: var(--accent); color: var(--bg); border: none; font-family: var(--font);
    font-size: 13px; font-weight: 600; padding: 10px 18px; border-radius: 8px; cursor: pointer;
    transition: opacity 0.2s; align-self: flex-end;
  }
  .chat-send:hover { opacity: 0.85; }
  .chat-send:disabled { opacity: 0.3; cursor: not-allowed; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>smolclaw</h1>
    <p class="subtitle">multi-agent gateway</p>
  </div>
  <div class="header-right">
    <span class="header-version" id="version"></span>
    <a href="/docs" target="_blank">API Docs</a>
  </div>
</div>

<div class="section-title">Agents</div>
<div class="grid" id="agents"><div class="empty">Loading...</div></div>

<div class="section-title">Scheduled Jobs</div>
<table id="jobs-table">
  <thead><tr><th>ID</th><th>Agent</th><th>Schedule</th><th>Status</th><th>Last Run</th><th>Next Run</th></tr></thead>
  <tbody id="jobs"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody>
</table>

<div class="health" id="health"></div>

<!-- Chat Panel -->
<div class="chat-overlay" id="chat-overlay">
  <div class="chat-panel">
    <div class="chat-header">
      <div class="chat-header-left">
        <span class="status on" id="chat-status"></span>
        <span class="chat-header-name" id="chat-name"></span>
        <span class="chat-header-model" id="chat-model"></span>
      </div>
      <div class="chat-header-actions">
        <button class="chat-btn" id="chat-new" title="New session">⟳ New</button>
        <button class="chat-btn chat-btn-close" id="chat-close" title="Close">✕</button>
      </div>
    </div>
    <div class="chat-messages" id="chat-messages">
      <div class="chat-empty">Send a message to start chatting</div>
    </div>
    <div class="chat-input-area">
      <textarea class="chat-input" id="chat-input" placeholder="Message..." rows="1"></textarea>
      <button class="chat-send" id="chat-send">Send</button>
    </div>
  </div>
</div>

<script>
const API = '';

async function fetchAgents() {
  try {
    const res = await fetch(`${API}/api/agents`);
    const data = await res.json();
    const el = document.getElementById('agents');
    if (!data.agents.length) { el.innerHTML = '<div class="empty">No agents configured.</div>'; return; }
    el.innerHTML = data.agents.map(a => `
      <div class="card" onclick="openChat('${a.name}', '${a.model}', ${a.connected})">
        <div class="card-header">
          <span class="card-name">${a.name}</span>
          <span class="status ${a.connected ? 'on' : 'off'}"></span>
        </div>
        <div class="card-meta">
          <span>${a.model}</span><br>
          ${a.channels.map(c => `<span>${c}</span>`).join('')}
          <span>${a.skills} skills</span>
          ${a.memory ? `<span>${a.memory.facts} facts · ${a.memory.chunks} chunks</span>` : ''}
        </div>
      </div>
    `).join('');
  } catch(e) { document.getElementById('agents').innerHTML = '<div class="empty">Failed to connect.</div>'; }
}

async function fetchJobs() {
  try {
    const res = await fetch(`${API}/api/cron/jobs`);
    const data = await res.json();
    const el = document.getElementById('jobs');
    if (!data.jobs.length) { el.innerHTML = '<tr><td colspan="6" class="empty">No jobs.</td></tr>'; return; }
    el.innerHTML = data.jobs.map(j => `
      <tr>
        <td>${j.id}</td>
        <td>${j.agent}</td>
        <td><code>${j.schedule}</code></td>
        <td><span class="tag tag-${j.status === 'ok' ? 'ok' : j.status === 'error' ? 'err' : 'pending'}">${j.status}</span></td>
        <td>${j.last_run ? new Date(j.last_run).toLocaleString() : '—'}</td>
        <td>${j.next_run ? new Date(j.next_run).toLocaleString() : '—'}</td>
      </tr>
    `).join('');
  } catch(e) {}
}

async function fetchHealth() {
  try {
    const res = await fetch(`${API}/api/health`);
    const data = await res.json();
    document.getElementById('health').textContent =
      `${data.agents} agents · ${data.channels} channels · ${data.jobs} jobs`;
    if (data.version) {
      document.getElementById('version').textContent = `v${data.version}`;
    }
  } catch(e) { document.getElementById('health').textContent = 'disconnected'; }
}

// --- Chat panel ---
let chatAgent = null;

function openChat(name, model, connected) {
  chatAgent = name;
  document.getElementById('chat-name').textContent = name;
  document.getElementById('chat-model').textContent = model;
  const dot = document.getElementById('chat-status');
  dot.className = `status ${connected ? 'on' : 'off'}`;
  document.getElementById('chat-overlay').classList.add('open');
  document.getElementById('chat-input').focus();
}

function closeChat() {
  chatAgent = null;
  document.getElementById('chat-overlay').classList.remove('open');
}

function clearMessages() {
  document.getElementById('chat-messages').innerHTML =
    '<div class="chat-empty">Send a message to start chatting</div>';
}

function addMessage(role, text) {
  const container = document.getElementById('chat-messages');
  // Remove empty state
  const empty = container.querySelector('.chat-empty');
  if (empty) empty.remove();
  // Remove thinking indicator if present
  const thinking = container.querySelector('.msg-thinking');
  if (thinking) thinking.remove();

  const div = document.createElement('div');
  div.className = `msg msg-${role}`;
  if (role === 'agent') {
    div.innerHTML = renderMarkdown(text);
  } else {
    div.textContent = text;
  }
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function showThinking() {
  const container = document.getElementById('chat-messages');
  const empty = container.querySelector('.chat-empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'msg-thinking';
  div.innerHTML = 'Thinking <span class="dots"><span></span><span></span><span></span></span>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

// Simple markdown renderer (bold, code blocks, inline code, line breaks)
function renderMarkdown(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || !chatAgent) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('chat-send').disabled = true;

  addMessage('user', text);
  showThinking();

  try {
    const res = await fetch(`${API}/api/agents/${encodeURIComponent(chatAgent)}/send`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    const data = await res.json();
    if (res.ok) {
      addMessage('agent', data.response);
    } else {
      addMessage('agent', `⚠️ Error: ${data.detail || 'Unknown error'}`);
    }
  } catch (e) {
    addMessage('agent', `⚠️ Connection failed: ${e.message}`);
  }
  document.getElementById('chat-send').disabled = false;
  document.getElementById('chat-input').focus();
}

async function newSession() {
  if (!chatAgent) return;
  try {
    await fetch(`${API}/api/agents/${encodeURIComponent(chatAgent)}/new-session`, { method: 'POST' });
  } catch(e) {}
  clearMessages();
  document.getElementById('chat-input').focus();
}

// Event listeners
document.getElementById('chat-close').addEventListener('click', closeChat);
document.getElementById('chat-new').addEventListener('click', newSession);
document.getElementById('chat-send').addEventListener('click', sendMessage);
document.getElementById('chat-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('chat-overlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeChat();
});
// Auto-resize textarea
document.getElementById('chat-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
// Escape to close
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeChat();
});

fetchAgents(); fetchJobs(); fetchHealth();
setInterval(() => { fetchAgents(); fetchJobs(); fetchHealth(); }, 10000);
</script>
</body>
</html>
