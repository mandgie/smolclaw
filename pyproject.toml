[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smolclaw"
version = "0.1.0"
description = "Lightweight multi-agent framework for personal AI assistants"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Magnus Friberg", email = "magnus.uno.friberg@gmail.com" },
]
keywords = ["ai", "agent", "assistant", "multi-agent", "telegram", "claude", "llm", "chatbot", "framework", "personal-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "claude-agent-sdk>=0.1.48",
    "python-telegram-bot>=21.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "croniter>=6.0",
    "click>=8.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
memory = [
    "sqlite-vec>=0.1.0",
]
watch = [
    "watchfiles>=1.0.0",
]
slack = [
    "slack-sdk[socket-mode]>=3.33.0",
    "aiohttp>=3.9.0",
]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
otel-otlp = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]
all = [
    "sqlite-vec>=0.1.0",
    "watchfiles>=1.0.0",
    "slack-sdk[socket-mode]>=3.33.0",
    "aiohttp>=3.9.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[project.scripts]
smolclaw = "smolclaw.cli:main"

[project.urls]
Homepage = "https://github.com/mandgie/smolclaw"
Repository = "https://github.com/mandgie/smolclaw"
"Bug Tracker" = "https://github.com/mandgie/smolclaw/issues"
Documentation = "https://mandgie.github.io/smolclaw"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "PTH", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode — false positives on Swedish text
    "RUF002",  # ambiguous unicode in docstrings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "SIM117",  # nested with statements — standard pytest pattern (patch + raises)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=smolclaw --cov-report=term-missing"

[tool.coverage.run]
source = ["smolclaw"]
omit = ["smolclaw/dashboard/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
